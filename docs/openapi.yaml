openapi: 3.0.3

info:
  title: ecommerce API
  version: 1.0.0
  description: REST API for the ecommerce application.

servers:
  - url: http://localhost:18080

tags:
  - name: Products
    description: Product management
  - name: Purchases
    description: Purchase management

paths:
  /api/v1/products:
    post:
      tags:
        - Products
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: SKU already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags:
        - Products
      summary: List products
      responses:
        '200':
          description: Products retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/products/search:
    get:
      tags:
        - Products
      summary: Search products
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string

        - name: sku
          in: query
          required: false
          schema:
            type: string

        - name: category
          in: query
          required: false
          schema:
            type: string

        - name: description
          in: query
          required: false
          schema:
            type: string

      responses:
        '200':
          description: Matching products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/products/{id}:
    parameters:
      - $ref: '#/components/parameters/ProductID'

    get:
      tags:
        - Products
      summary: Get a product
      responses:
        '200':
          description: Product retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - Products
      summary: Update a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: SKU already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Products
      summary: Delete a product
      responses:
        '204':
          description: Product deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/products/import:
    post:
      tags:
        - Products
      summary: Import products from CSV
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Products imported successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResponse'
        '400':
          description: Invalid CSV or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/purchases:
    post:
      tags:
        - Purchases
      summary: Create a purchase
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Unique key used to safely retry the same purchase.
          schema:
            type: string

        - name: X-Fake-Payment
          in: header
          required: false
          description: Set to fail to simulate a declined payment.
          schema:
            type: string
            enum:
              - fail

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePurchaseRequest'

      responses:
        '201':
          description: Purchase created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseResponse'

        '400':
          $ref: '#/components/responses/BadRequest'

        '402':
          description: Payment declined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '404':
          $ref: '#/components/responses/NotFound'

        '409':
          description: Purchase conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags:
        - Purchases
      summary: List purchases
      responses:
        '200':
          description: Purchases retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PurchaseResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/purchases/{id}:
    parameters:
      - $ref: '#/components/parameters/PurchaseID'

    get:
      tags:
        - Purchases
      summary: Get a purchase
      responses:
        '200':
          description: Purchase retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:

  parameters:

    ProductID:
      name: id
      in: path
      required: true
      description: Product identifier
      schema:
        type: integer
        format: int64
        minimum: 1

    PurchaseID:
      name: id
      in: path
      required: true
      description: Purchase identifier
      schema:
        type: integer
        format: int64
        minimum: 1

  schemas:

    CreateProductRequest:
      type: object
      required:
        - name
        - category
        - weight_kg
      properties:

        name:
          type: string
          example: Wireless Headphones

        sku:
          type: string
          example: WH-1000

        description:
          type: string
          example: Wireless over-ear headphones

        category:
          type: string
          example: Electronics

        price:
          type: string
          example: "89.99"
          pattern: '^[0-9]+(\.[0-9]{1,2})?$'

        stock:
          type: integer
          minimum: 0
          example: 25

        weight_kg:
          type: string
          example: "0.850"
          pattern: '^[0-9]+(\.[0-9]{1,3})?$'

    ProductResponse:
      type: object
      properties:

        id:
          type: integer
          format: int64
          example: 1

        name:
          type: string
          example: Wireless Headphones

        sku:
          type: string
          example: WH-1000

        description:
          type: string
          example: Wireless over-ear headphones

        category:
          type: string
          example: Electronics

        price:
          type: string
          example: "89.99"

        stock:
          type: integer
          example: 25

        weight_kg:
          type: string
          example: "0.850"

    CreatePurchaseRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PurchaseItemRequest'

    PurchaseItemRequest:
      type: object
      required:
        - product_id
        - quantity
      properties:

        product_id:
          type: integer
          format: int64
          minimum: 1
          example: 1

        quantity:
          type: integer
          minimum: 1
          example: 2

    PurchaseResponse:
      type: object
      properties:

        id:
          type: integer
          format: int64
          example: 7

        status:
          type: string
          enum:
            - PENDING
            - PAID
            - FAILED
          example: PAID

        total:
          type: string
          example: "179.98"

        items:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseItemResponse'

    PurchaseItemResponse:
      type: object
      properties:

        product_id:
          type: integer
          format: int64
          example: 1

        quantity:
          type: integer
          example: 2

        unit_price:
          type: string
          example: "89.99"

        subtotal:
          type: string
          example: "179.98"

    ImportResponse:
      type: object
      properties:
        imported:
          type: integer
          example: 10

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: invalid request

  responses:

    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'